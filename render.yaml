# $0 demo — Render Free web service (512MB RAM — migrations run locally first)
# Database: Supabase Free | Redis: Upstash Free

services:
  - type: web
    name: twenty-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_PORT
        value: "3000"
      - key: PG_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: STORAGE_TYPE
        value: local
      - key: IS_MULTIWORKSPACE_ENABLED
        value: "false"
      - key: PG_SSL_ALLOW_SELF_SIGNED
        value: "true"
      - key: DISABLE_DB_MIGRATIONS
        value: "true"
      - key: DISABLE_CRON_JOBS_REGISTRATION
        value: "true"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
