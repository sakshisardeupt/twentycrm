# One-time: run Twenty DB migrations using GitHub's runner (7GB RAM).
#
# Setup (required before running):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#   - PG_DATABASE_URL  (Supabase session pooler, NO ?sslmode= on the end)
#   - REDIS_URL          (full Upstash URL)
#   - ENCRYPTION_KEY
#
# Then: Actions → Run Twenty DB migrations → Run workflow

name: Run Twenty DB migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate secrets are configured
        env:
          PG_DATABASE_URL: ${{ secrets.PG_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          missing=""
          [ -z "$PG_DATABASE_URL" ] && missing="$missing PG_DATABASE_URL"
          [ -z "$ENCRYPTION_KEY" ] && missing="$missing ENCRYPTION_KEY"
          if [ -n "$missing" ]; then
            echo "ERROR: Missing GitHub Actions secrets:$missing"
            echo ""
            echo "Add them at:"
            echo "  https://github.com/sakshisardeupt/twentycrm/settings/secrets/actions"
            echo ""
            echo "PG_DATABASE_URL example (session pooler, no sslmode query param):"
            echo "  postgresql://postgres.zqaiuqnynmchvmmfqunx:PASSWORD@aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres"
            exit 1
          fi
          echo "All required secrets are set."

      - name: Run migrations against Supabase
        env:
          PG_DATABASE_URL: ${{ secrets.PG_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          REDIS="${REDIS_URL:-redis://127.0.0.1:6379}"
          docker run --rm \
            -e "PG_DATABASE_URL=${PG_DATABASE_URL}" \
            -e "PG_SSL_ALLOW_SELF_SIGNED=true" \
            -e "REDIS_URL=${REDIS}" \
            -e "ENCRYPTION_KEY=${ENCRYPTION_KEY}" \
            -e "SERVER_URL=http://localhost:3000" \
            -e "DISABLE_CRON_JOBS_REGISTRATION=true" \
            -e "NODE_OPTIONS=--max-old-space-size=4096" \
            twentycrm/twenty:latest \
            sh -c "echo Migrations finished successfully"
