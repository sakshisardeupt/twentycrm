# Migrations must use DIRECT Supabase URL (db.[ref].supabase.co) — pooler cannot run DDL.
# Render/Northflank app runtime should use SESSION POOLER URL instead.

name: Run Twenty DB migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate secrets are configured
        env:
          PG_DATABASE_URL: ${{ secrets.PG_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          missing=""
          [ -z "$PG_DATABASE_URL" ] && missing="$missing PG_DATABASE_URL"
          [ -z "$REDIS_URL" ] && missing="$missing REDIS_URL"
          [ -z "$ENCRYPTION_KEY" ] && missing="$missing ENCRYPTION_KEY"
          if [ -n "$missing" ]; then
            echo "ERROR: Missing GitHub Actions secrets:$missing"
            echo "Add them at: https://github.com/sakshisardeupt/twentycrm/settings/secrets/actions"
            echo "PG_DATABASE_URL must use db.[ref].supabase.co (direct), not pooler."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Run migrations against Supabase
        env:
          PG_DATABASE_URL: ${{ secrets.PG_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          docker run --rm \
            -e "PG_DATABASE_URL=${PG_DATABASE_URL}" \
            -e "PG_SSL_ALLOW_SELF_SIGNED=true" \
            -e "REDIS_URL=${REDIS_URL}" \
            -e "ENCRYPTION_KEY=${ENCRYPTION_KEY}" \
            -e "SERVER_URL=http://localhost:3000" \
            -e "DISABLE_CRON_JOBS_REGISTRATION=true" \
            -e "NODE_OPTIONS=--max-old-space-size=4096" \
            twentycrm/twenty:latest \
            sh -c "echo Migrations finished successfully"
